<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <filter id="geoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- MAIN GEOFrecuencia EMBLEM GROUP -->
  <g transform="translate(4, 0)">
    
    <!-- 1. ORIGIN POINT (Sensor Pulse Origin) -->
    <circle cx="58" cy="256" r="6.5" fill="url(#amberGrad)" filter="url(#geoGlow)" />

    <!-- 2. SEISMIC WAVEFORM (GEOPHYSICS & FIELD MEASUREMENTS) -->
    <!-- Flat baseline to initial precursor tremor -->
    <path d="M 68,256 
             L 100,256 
             L 110,274 
             L 122,236 
             L 132,270 
             L 148,155 
             L 164,352 
             L 178,220 
             L 188,272 
             L 198,256 
             L 214,256" 
          stroke="#ffffff" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Horizontal connector beam through D with amber highlight -->
    <line x1="214" y1="256" x2="280" y2="256" 
          stroke="url(#amberGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          filter="url(#geoGlow)" />

    <!-- 3. MONOGRAM LETTER D -->
    <!-- D vertical stem -->
    <line x1="228" y1="184" x2="228" y2="328" 
          stroke="#ffffff" 
          stroke-width="9.5" 
          stroke-linecap="round" />

    <!-- D outer curve loop -->
    <path d="M 228,184 
             L 254,184 
             C 288,184 308,206 308,256 
             C 308,306 288,328 254,328 
             L 228,328" 
          stroke="#ffffff" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 4. MONOGRAM LETTER S -->
    <path d="M 374,212 
             C 365,192 344,184 326,184 
             C 302,184 288,198 288,218 
             C 288,252 358,244 358,284 
             C 358,312 334,328 312,328 
             C 292,328 276,316 268,298" 
          stroke="#ffffff" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Terminal Amber Accent Dot on S -->
    <circle cx="380" cy="328" r="5.5" fill="url(#amberGrad)" filter="url(#geoGlow)" />

    <!-- 5. BROADCAST TRANSMISSION WAVES (STRATEGIC COMMUNICATIONS) -->
    <!-- Arc 1: Core Frequency Arc (Tactical Amber) -->
    <path d="M 376,192 
             A 52,52 0 0,1 416,248" 
          stroke="url(#amberGrad)" 
          stroke-width="9.0" 
          stroke-linecap="round" 
          filter="url(#geoGlow)" />

    <!-- Arc 2: Medium Broadcast Wavefront -->
    <path d="M 396,166 
             A 84,84 0 0,1 448,254" 
          stroke="#ffffff" 
          stroke-width="8.0" 
          stroke-linecap="round" 
          opacity="0.9" />

    <!-- Arc 3: Outer Atmospheric Wavefront -->
    <path d="M 416,140 
             A 116,116 0 0,1 478,260" 
          stroke="#ffffff" 
          stroke-width="7.0" 
          stroke-linecap="round" 
          opacity="0.55" />
  </g>
</svg>